name: Build and Publish Blog Image

on:
  push:
    branches:
      - main
      - master
    paths:
      - "web/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".github/workflows/publish-ghcr-image.yml"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "web/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".github/workflows/publish-ghcr-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Run Go tests
        run: go test -v -race ./...

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run web tests
        working-directory: web
        run: npm test

      - name: Build Next.js static export
        working-directory: web
        run: npm run build

  build-and-push:
    name: Build & Push Multi-Arch Image
    needs: [quality-gates]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/blog-web
          tags: |
            type=sha,prefix=sha-,format=short
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push multi-arch image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish full image references
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          OWNER: ${{ github.repository_owner }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${OWNER,,}/blog-web"
          PINNED="${IMAGE}@${DIGEST}"
          echo "Commit SHA:    ${COMMIT_SHA}"
          echo "Image digest:  ${DIGEST}"
          echo "Pinned image:  ${PINNED}"
          echo "Tags:"
          echo "${TAGS}" | sed 's/^/  /'
          echo "::notice title=Pinned image::${PINNED}"
          {
            echo "## Published \`blog-web\` image"
            echo
            echo "| Field | Value |"
            echo "| :--- | :--- |"
            echo "| Commit SHA | \`${COMMIT_SHA}\` |"
            echo "| Image digest | \`${DIGEST}\` |"
            echo "| Pinned reference | \`${PINNED}\` |"
            echo
            echo "### Tags"
            echo
            echo "${TAGS}" | sed 's/^\(.*\)$/- `\1`/'
            echo
            echo "### Pin in nacfson_pipeline (update-project-images)"
            echo
            echo '```text'
            echo "proj-blog web image: ${PINNED}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
